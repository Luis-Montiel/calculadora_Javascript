<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="calculadora">
    <h1>Calculadora</h1> 
    <input type="number" id="numero1" placeholder="Primer número">
    <input type="number" id="numero2" placeholder="Segundo número">

    <button id="sumar">Sumar</button>
    <button id="restar">Restar</button>
    <button id="multiplicar">Multiplicar</button>
    <button id="dividir">Dividir</button>
    
    <!-- Se ajustó la id a "resultado" con minúscula para coincidir con JS/CSS -->
    <h2 id="resultado">Resultado:</h2>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
